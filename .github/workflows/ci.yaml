name: Build and Test

on:
  pull_request:
    branches:
      - v4
  push:
    branches:
      - v4
      - preview/homepage-outcome-full
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci

      - name: Check design contract
        run: npm run check:design

      - name: Check types and style
        run: npm run check

      - name: Test
        run: npm test

      - name: Ensure Quartz builds, check bundle info
        run: npx quartz build --bundleInfo -d docs

  share-poster-browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser and CJK fonts
        run: |
          npx playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
      - name: Build Quartz documentation for integration smoke test
        run: npx quartz build -d docs
      - name: Verify DOM layout, pixels, resource failures and share lifecycle
        run: npm run test:share-browser -- --project=${{ matrix.browser }}
        env:
          SHARE_QA_SITE_DIRECTORY: public
          SHARE_QA_RUN: fixtures
      - name: Build actual blog articles for share validation
        if: ${{ !cancelled() }}
        run: npx quartz build -o .quartz-cache/share-production
      - name: Verify DDD, vector database and labeled formula/table/image excerpts
        if: ${{ !cancelled() }}
        run: npm run test:share-browser -- --project=${{ matrix.browser }} --grep 'built Quartz article'
        env:
          SHARE_QA_SITE_DIRECTORY: .quartz-cache/share-production
          SHARE_QA_REAL_ARTICLES: "1"
          SHARE_QA_RUN: production
      - name: Upload share-image evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: share-posters-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  publish-tag:
    if: ${{ github.repository == 'jackyzha0/quartz' && github.ref == 'refs/heads/v4' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Get package version
        run: node -p -e '`PACKAGE_VERSION=${require("./package.json").version}`' >> $GITHUB_ENV
      - name: Create release tag
        uses: pkgdeps/git-tag-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"
